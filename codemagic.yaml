# Codemagic setup for the Job Command iPhone app (Capacitor 8, CocoaPods).
# The website stays on Vercel. This file only builds the iPhone app and uploads it to TestFlight.
# Plan: free Codemagic "Individual" (500 Mac mini M2 minutes a month), so builds are kept lean:
#   - starts only when you press "Start new build" or push a tag like ios-v1.0.0 (never on every push)
#   - 45-minute cap, npm + CocoaPods download caches
# Before the first build, do the steps in CODEMAGIC-SETUP.md (Apple account, API key, app record).

workflows:
  ios-testflight:
    name: Job Command iPhone -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45

    # Name of the App Store Connect API key in Codemagic:
    # Team settings > Team integrations > Developer Portal > Manage keys. It must be exactly this name.
    integrations:
      app_store_connect: Job Command ASC Key

    environment:
      groups:
        - ios_signing        # holds CERTIFICATE_PRIVATE_KEY (see CODEMAGIC-SETUP.md step 6)
      vars:
        BUNDLE_ID: app.jobcommand.shop          # appId in capacitor.config.json
        APP_NAME: Job Command
        APP_VERSION: 1.0.0                       # the version people see in the App Store
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        IOS_PUSH: "true"                         # turn on Apple push for the app id + add the entitlement
        DATABASE_URL: file:./ci.db               # only so `prisma generate` has a value; no database is used
        NEXT_TELEMETRY_DISABLED: "1"
      node: 22                                   # Capacitor 8 CLI needs Node 22+
      xcode: latest                              # Apple requires the newest Xcode (26) for uploads
      cocoapods: default

    cache:
      cache_paths:
        # npm ci always deletes node_modules, so the npm download cache is what actually saves time.
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-v*"
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Install packages (runs prisma generate)
        script: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx prisma generate

      - name: Tests, iOS config test, typecheck, lint (stop here if anything fails)
        script: |
          set -euo pipefail
          npm test
          npx tsx --test lib/ios-config.test.ts
          npx tsc --noEmit
          npx next lint

      - name: Apple checks - app record, app id, push capability
        script: |
          set -euo pipefail
          APP_ID=$(app-store-connect apps list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --json | jq -r '.[0].id // empty')
          if [ -z "$APP_ID" ]; then
            echo "No App Store Connect app record for $BUNDLE_ID yet. Create it first (CODEMAGIC-SETUP.md step 3)." >&2
            exit 1
          fi
          echo "APP_STORE_APPLE_ID=$APP_ID" >> "$CM_ENV"

          BID=$(app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --platform IOS --json | jq -r '.[0].id // empty')
          if [ -z "$BID" ]; then
            BID=$(app-store-connect bundle-ids create "$BUNDLE_ID" --name "$APP_NAME" --platform IOS --json | jq -r '.id')
          fi

          PUSH_READY=false
          if [ "$IOS_PUSH" = "true" ]; then
            has_push() {
              app-store-connect bundle-ids capabilities "$BID" --json \
                | jq -e 'map(select(.attributes.capabilityType == "PUSH_NOTIFICATIONS")) | length > 0' >/dev/null
            }
            if ! has_push; then
              app-store-connect bundle-ids enable-capabilities "$BID" --capability "Push Notifications" \
                || echo "Could not turn on Push Notifications from here - turn it on at developer.apple.com (CODEMAGIC-SETUP.md step 4)."
            fi
            if has_push; then PUSH_READY=true; else
              echo "WARNING: building WITHOUT push. The app still works; alerts just won't reach the lock screen."
            fi
          fi
          echo "PUSH_READY=$PUSH_READY" >> "$CM_ENV"
          echo "App Store Connect app $APP_ID, bundle id resource $BID, push ready: $PUSH_READY"

      - name: Create the iPhone project and copy in Job Command's native files
        script: |
          set -euo pipefail
          # ios/ is not in git. Capacitor 8 defaults to Swift Package Manager, but the speech plugin
          # (@capacitor-community/speech-recognition) only ships a CocoaPods podspec, so use CocoaPods.
          rm -rf ios
          npx cap add ios --packagemanager CocoaPods
          # Permission strings, privacy manifest, screen shield, icon + splash, then `npx cap sync ios`.
          bash native/ios/apply-ios-config.sh

      - name: Wire the Xcode project (what MAC-BUILD.md does by hand in Xcode)
        script: |
          set -euo pipefail
          python3 -m venv "$HOME/.venvs/pbx"
          "$HOME/.venvs/pbx/bin/pip" install --quiet pbxproj==4.3.3

          if [ "$PUSH_READY" = "true" ]; then
            cat > ios/App/App/App.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>aps-environment</key>
            <string>production</string>
          </dict>
          </plist>
          PLIST
          fi

          "$HOME/.venvs/pbx/bin/python" - <<'PY'
          import os, pathlib
          from pbxproj import XcodeProject

          # 1. Add the screen shield, its view controller and the privacy manifest to target App.
          proj = XcodeProject.load("ios/App/App.xcodeproj/project.pbxproj")
          app_group = proj.get_groups_by_name("App")[0]
          for name in ("MainViewController.swift", "ScreenShieldPlugin.swift", "PrivacyInfo.xcprivacy"):
              assert pathlib.Path("ios/App/App", name).exists(), f"missing ios/App/App/{name}"
              if not proj.get_files_by_name(name):
                  proj.add_file(f"App/{name}", parent=app_group, target_name="App", force=False)

          # 2. iPhone only, version, bundle id, agvtool-friendly versioning, push entitlement.
          flags = {
              "TARGETED_DEVICE_FAMILY": "1",
              "VERSIONING_SYSTEM": "apple-generic",
              "MARKETING_VERSION": os.environ["APP_VERSION"],
              "PRODUCT_BUNDLE_IDENTIFIER": os.environ["BUNDLE_ID"],
          }
          if os.environ.get("PUSH_READY") == "true":
              flags["CODE_SIGN_ENTITLEMENTS"] = "App/App.entitlements"
          for key, value in flags.items():
              proj.set_flags(key, value, target_name="App")
          proj.save()

          # 3. Main.storyboard: Bridge View Controller -> MainViewController (registers ScreenShield).
          sb = pathlib.Path("ios/App/App/Base.lproj/Main.storyboard")
          text = sb.read_text()
          old = 'customClass="CAPBridgeViewController" customModule="Capacitor"'
          new = 'customClass="MainViewController" customModule="App" customModuleProvider="target"'
          if new not in text:
              assert old in text, "Main.storyboard: Bridge View Controller not found"
              sb.write_text(text.replace(old, new, 1))

          # 4. AppDelegate: hand the APNs token to @capacitor/push-notifications (its iOS setup step).
          ad = pathlib.Path("ios/App/App/AppDelegate.swift")
          src = ad.read_text()
          if "capacitorDidRegisterForRemoteNotifications" not in src:
              anchor = "        return true\n    }\n"
              assert anchor in src, "AppDelegate.swift: didFinishLaunching not found"
              hook = (
                  "\n    func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {\n"
                  "        NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)\n"
                  "    }\n\n"
                  "    func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {\n"
                  "        NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)\n"
                  "    }\n"
              )
              ad.write_text(src.replace(anchor, anchor + hook, 1))
          print("Xcode project wired:", flags)
          PY

      - name: Code signing - Codemagic fetches or creates the distribution certificate + profile
        script: |
          set -euo pipefail
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --strict-match-identifier \
            --delete-stale-profiles \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build number = latest on App Store Connect + 1
        script: |
          set -euo pipefail
          TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)
          AS=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)
          TF=${TF%%.*}; AS=${AS%%.*}
          [[ "$TF" =~ ^[0-9]+$ ]] || TF=0
          [[ "$AS" =~ ^[0-9]+$ ]] || AS=0
          LATEST=$(( TF > AS ? TF : AS ))
          NEW_BUILD=$(( LATEST + 1 ))
          cd ios/App
          agvtool new-version -all "$NEW_BUILD"
          echo "Version $APP_VERSION, build $NEW_BUILD (latest on App Store Connect was $LATEST)"

      - name: Build the signed .ipa
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      email:
        recipients:
          - jobcommandofficial@gmail.com   # Job Command's email (switched Oct 2, 2026)
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true    # TestFlight only
        # beta_groups:                # optional: outside testers, after Apple's beta review
        #   - Crew testers
        submit_to_app_store: false    # never sends the app to App Store review
